# ============================================================================
# 服务索引 配置文件示例 (config.example.yaml)
# ----------------------------------------------------------------------------
# 说明：
#   * 正式运行时文件名应为 config.yaml（容器内默认 /data/config.yaml）。
#   * 首次启动若没有 config.yaml，程序会自动用内置默认值生成一份。
#   * 服务可以在网页里增删改，也可以直接手动编辑本文件后重启。
#   * password_hash / secret_key / transport_key 由程序自动维护，不要手填明文密码。
# ============================================================================

# 页面标题
title: 服务索引

# 会话签名密钥：留空时程序会自动生成并写回（请勿手动改动）。
secret_key: ""

# 访问密码的哈希值：通过“网页首次设置”或 `python app.py setpw` 写入。
# 明文密码永远不会落盘，这里存的是 scrypt 哈希。
password_hash: ""

# 密码传输加密用的 RSA 私钥 (PEM)：留空时程序自动生成 2048 位并写回。
# 浏览器提交密码前会用对应公钥加密，请求体里没有明文；详见 README「安全说明」。
# 放在配置里（而不是每次启动现生成）是为了多 worker / 重启后用的是同一把钥匙。
transport_key: ""

# ----------------------------------------------------------------------------
# 端口发现 discover
# ----------------------------------------------------------------------------
# 顶栏 🔍 的默认参数。整段可以删掉，程序会自动补回默认值。
discover:
  timeout: 0.4            # 单个端口的连接超时（秒）；丢包严重的网络可以调大到 1 左右
  concurrency: 256        # 并发连接数，上限 512。太大容易撞到容器的文件描述符上限
  allow_public: false     # 默认只许扫内网地址，以及本文件里出现过的主机/域名。
                          # 改成 true 才允许扫公网 —— 想清楚再开。

# ----------------------------------------------------------------------------
# 自定义背景 background
# ----------------------------------------------------------------------------
# 顶栏 🖼 上传的背景。留 null（或整段删掉）就用主题自带的深色渐变底。
#
# 文件本身在 data/uploads/ 下，跟 config.yaml 一起待在挂载卷上，重建容器不会丢。
# 这里只记类型和文件名，所以直接改这两行是没用的 —— 请在网页上传。
# 文件要是被手动删了，程序会自动回落到默认渐变底，不会显示成一张裂图。
background: null
# background:
#   type: image           # image 或 video
#   file: bg-custom.jpg   # 固定叫 bg-custom.<后缀>，同时只保留一张

# ----------------------------------------------------------------------------
# 网络定义 networks
# ----------------------------------------------------------------------------
# 顺序很重要：判断“当前从哪个网络访问”时，从上到下，第一个 match 命中的生效。
# 每个网络字段：
#   id    : 唯一标识（英文）
#   name  : 显示名
#   icon  : 一个 emoji（可选）
#   mode  : port 或 domain
#           - port   ：用「本网络 host : 服务 port」拼地址（内网 / 组网这种同一台机器、靠端口区分服务的场景）
#           - domain ：用「服务自己的 domain」拼地址（公网穿透 / nginx 反代，每个服务一个域名）
#   host  : 仅 mode=port 需要，本网络下这台机器的地址
#   match : 匹配你“访问索引页时所用的域名/IP”的规则列表，命中即判定为该网络
#           规则支持三种写法：
#             - 精确匹配      example.com
#             - 子域名通配    *.example.com   （匹配 a.example.com、index.example.com …）
#             - 前缀通配      192.168.*      （匹配 192.168.x.x）
#           注：真正的判定以浏览器地址栏（前端）为准，服务端只做兜底推断。
networks:
  - id: lan
    name: 内网
    icon: 🏠
    mode: port
    host: 192.168.1.50
    match:
      - "192.168.*"

  - id: mesh
    name: 组网
    icon: 🛰️
    mode: port
    host: 10.8.0.5          # 组网软件（异地组网/虚拟局域网）分配给这台机器的地址
    match:
      - "10.*"
      - "100.*"               # 例如 Tailscale 的 100.x 网段

  - id: public
    name: 公网
    icon: 🌐
    mode: domain              # 公网走域名，端口/反代差异由各服务的 domain 决定
    match:
      - "*.example.com"

# ----------------------------------------------------------------------------
# 服务列表 services
# ----------------------------------------------------------------------------
# 每个服务字段：
#   id       : 唯一标识，网页添加时自动生成；手动新增可随便给个不重复的串
#   name     : 服务名（必填）
#   desc     : 一句话描述（可选）
#   icon     : 一个 emoji（可选，留空会用名字首字母生成色块头像）
#   category : 分类，用于页面分组与筛选（可选，默认“应用”）
#   port     : 端口；mode=port 的网络（内网/组网）靠它拼地址
#   scheme   : http 或 https（可选）。留空时：port 网络默认 http，domain 网络默认 https
#   tunnel   : 是否做了内网穿透 / 反向代理（true/false）
#   domain   : 穿透/反代后的域名；tunnel=true 时必填，公网网络靠它拼地址
#   path     : 访问路径（可选），例如 /admin、/web
#
# 可达性规则：
#   - 至少要有 port 或 domain 其一，否则任何网络都不可达（程序会拒绝保存）。
#   - 没填 domain 的服务，在“公网”网络下会显示为不可用（灰色）。
#   - 没填 port 的服务，在“内网/组网”网络下会显示为不可用。
services:
  - id: demo00001
    name: Jellyfin
    desc: 媒体服务器
    icon: 🎬
    category: 媒体
    port: 8096
    scheme: http
    tunnel: true
    domain: jellyfin.example.com

  - id: demo00002
    name: qBittorrent
    desc: BT 下载
    icon: 📥
    category: 下载
    port: 8080
    tunnel: true
    domain: qb.example.com

  # 仅内网/组网可用（没做穿透）：在“公网”视图下会显示为不可用
  - id: demo00003
    name: Home Assistant
    desc: 智能家居 · 仅内网/组网
    icon: 🏡
    category: 运维
    port: 8123
    tunnel: false

  - id: demo00004
    name: Dockge
    desc: Docker 栈管理
    icon: 🐳
    category: 运维
    port: 5001
    tunnel: false

  # --------------------------------------------------------------------------
  # 进阶示例（仅手动编辑 YAML 时用）：按网络覆盖 host / domain
  # --------------------------------------------------------------------------
  # 适用于“同一个服务在不同网络其实不在同一台机器/不是同一个域名”的少数情况。
  #   hosts.<网络id>   覆盖该网络（port 模式）下使用的主机地址
  #   domains.<网络id> 覆盖该网络（domain 模式）下使用的域名
  # 未覆盖的网络仍回退到 networks[].host 或 service.domain。
  #
  # - id: adv00001
  #   name: NAS 管理
  #   desc: 跑在另一台 NAS 上
  #   icon: 💾
  #   category: 运维
  #   port: 5000
  #   tunnel: true
  #   domain: nas.example.com      # 公网默认用这个
  #   hosts:
  #     lan: 192.168.1.60        # 内网下 NAS 是这台
  #     mesh: 10.8.0.6          # 组网下 NAS 是这台
  #   domains:
  #     public: nas.example.com    # 也可针对某个 domain 网络单独指定
